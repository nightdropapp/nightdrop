# cargo-audit configuration. Advisories reviewed and accepted, with rationale — run `cargo audit`
# from the repo root. Re-review on every dependency bump. The first four re-checked for arti 0.48
# (2026-11-14): `cargo audit` with nothing ignored found exactly those four, and each reason held.
# CI runs `cargo audit --deny warnings`, so an "unmaintained" notice fails it like a vulnerability.
[advisories]
ignore = [
  # RUSTSEC-2023-0071 — RSA "Marvin Attack": a timing side-channel in RSA PKCS#1 v1.5 decryption.
  # Present ONLY transitively (arti-client -> tor-key-forge -> ssh-key-fork-arti -> rsa), pulled
  # because arti's SSH-key keystore format *supports* RSA keys. Night Drop uses ed25519/x25519
  # exclusively and never generates or decrypts an RSA key, so the vulnerable code path is never
  # reached. No fixed upstream version exists. Re-evaluate if we ever handle RSA material.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2025-0141 — bincode is unmaintained (not a vulnerability). It is in Cargo.lock only as an
  # optional dependency of typed-index-collections (via arti) whose feature is off: `cargo tree -i
  # bincode` finds it in no build, so no Night Drop binary contains it. Reviewed 2026-10-17.
  "RUSTSEC-2025-0141",
  # RUSTSEC-2024-0436 — paste is unmaintained (archived as complete; no known bug). A proc-macro used
  # at compile time by pwd-grp (arti's fs-mistrust); it generates code and never runs in the app.
  # Reviewed 2026-10-17. Re-check both whenever arti is bumped.
  "RUSTSEC-2024-0436",
  # RUSTSEC-2026-0387 — crypto-bigint 0.5.5 has non-constant-time operations. It is in Cargo.lock only
  # through elliptic-curve 0.13, which ssh-key-fork-arti (via arti's tor-key-forge) lists for its
  # optional p256/p384/p521 ECDSA key support; those features are off. `cargo tree -i crypto-bigint
  # --workspace --all-features --target all` finds it in no build, so no Night Drop binary contains
  # it. The fix (>=0.7.6) is semver-incompatible with elliptic-curve 0.13. Reviewed 2026-10-27.
  # Re-check whenever arti is bumped.
  "RUSTSEC-2026-0387",
  # RUSTSEC-2026-0543 — chrono is unmaintained (not a vulnerability). It is in Cargo.lock only as an
  # optional dependency of serde_with (via arti's tor-* crates) whose `chrono` feature is off:
  # `cargo tree -i chrono@0.4.45 --workspace --all-features --target all -e all` prints nothing, so
  # no Night Drop binary contains it. Reviewed 2026-11-17 (advisory published that day).
  "RUSTSEC-2026-0543",
  # RUSTSEC-2026-0542 — humantime is unmaintained (not a vulnerability; no fixed version exists). It
  # IS compiled in: arti-client, tor-dirmgr, tor-guardmgr and other arti 0.48 crates use it for
  # durations in arti's config, its own state files (guard records) and error text ("Retrying in
  # 5m"). Night Drop builds arti's config in code and never loads a config file; the one user text
  # that reaches arti, a bridge line, goes through a parser that does not use humantime. Replacing
  # it is arti's call. Reviewed 2026-11-17 (advisory published that day). Re-check whenever arti is bumped.
  "RUSTSEC-2026-0542",
]
