# nginx vhost for the Night Drop clear-web site (nightdrop.app). Drop-in — no editing needed:
#
#   sudo cp deploy/nginx-nightdrop.conf /etc/nginx/conf.d/nightdrop.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The target host also serves other sites, so this only ever adds a vhost in conf.d; it must not
# become nginx.conf. TLS: certbot --nginx -d nightdrop.app -d www.nightdrop.app (obtain the cert
# BEFORE installing this, or `nginx -t` fails on the missing ssl_certificate — see docs/hosting.md).
# The static site is deployed to /var/www/nightdrop by scripts/deploy-vps.sh.
#
# The ONION mirror is NOT configured here. It runs on a different host entirely; if you ever
# migrate it, deploy/nginx-nightdrop-onion.conf is its vhost. Read docs/hosting.md section 6 first.

# .webmanifest isn't in nginx's default mime.types.
types { application/manifest+json  webmanifest; }

# ---- HTTP -> HTTPS (clear web) ----
server {
    listen 80;
    listen [::]:80;
    server_name nightdrop.app www.nightdrop.app;
    # ACME http-01 challenge must stay on :80.
    location /.well-known/acme-challenge/ { root /var/www/nightdrop; }
    location / { return 301 https://nightdrop.app$request_uri; }
}

# ---- HTTPS (clear web) ----
server {
    # HTTP/2 as a `listen` parameter, NOT the newer `http2 on;` directive. The target box runs
    # nginx 1.18 (Ubuntu 20.04) and `http2 on;` did not exist until 1.25.1 — it fails there with
    # `unknown directive "http2"`. This spelling is accepted by every version in between; nginx
    # >= 1.25.1 logs a deprecation warning for it, which is harmless. Flip it to `http2 on;` only
    # once the server itself is on >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nightdrop.app;

    root /var/www/nightdrop;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nightdrop.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightdrop.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Point Tor Browser at the onion mirror (privacy). Replace with your .onion.
    add_header Onion-Location "http://z6xw2ywlybjeskki4jons5ujepc2pedp5qkgvtbyxorie46qnjpnzqqd.onion$request_uri" always;

    # Security headers. The site is self-contained; the only scripts are inline (hydrate +
    # JSON-LD), so script/style need 'unsafe-inline' (tighten to hashes later if desired).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /.well-known/security.txt { default_type text/plain; }
    # security.txt's `Policy:` URL, staged into the web root by scripts/deploy-vps.sh.
    # Served as plain text so it renders in the browser instead of downloading. The empty
    # `types` block is doing real work and is not redundant with default_type: nginx >= 1.21
    # ships `text/markdown md` in mime.types (older ones, e.g. 1.18 on Ubuntu 20.04, do not),
    # and default_type applies ONLY when the extension is unmapped. Clearing the map for this
    # one location makes the result the same on every nginx. Verified both ways.
    location = /SECURITY.md { types { } default_type text/plain; charset utf-8; }
    location / { try_files $uri $uri/ =404; }

    # Long-cache the immutable, content-addressed assets; keep HTML fresh.
    location ~* \.(png|css|webmanifest)$ { expires 7d; add_header Cache-Control "public"; }
}
