# Rust workspace for Night Drop's security core and the minimal relay server.
# The Flutter app lives in app/ and is built separately with the Flutter toolchain.
[workspace]
resolver = "2"
members = ["core", "relay", "webtunnel", "moat"]
# Patched dependencies, built through [patch.crates-io] below, not workspace members.
exclude = ["third_party/rdrand", "third_party/saturating-time", "third_party/tor-hsservice", "third_party/tor-dirmgr"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
# Bumped 1.75 -> 1.85 for the hybrid PQ pairing (§4.1): the vetted `ml-kem` (FIPS 203) crate
# requires 1.85. Then 1.85 -> 1.92 for arti 0.47 (its MSRV); F-Droid builds with 1.96.
rust-version = "1.92"

# Build the security-critical core with overflow checks even in release.
[profile.release]
overflow-checks = true

# saturating-time 0.5.0 still loops forever on Windows, which hangs Tor over bridges (arti#2726).
# See third_party/saturating-time/NIGHTDROP-PATCH.md.
# rdrand 0.9.0 reads ID_AA64ISAR0_EL1 directly on Android, which kills the app with SIGILL on
# kernels before 4.11 (issue #22). See third_party/rdrand/NIGHTDROP-PATCH.md.
# tor-hsservice: publisher fixes and no-plaintext rejected-descriptor storage. See
# third_party/tor-hsservice/NIGHTDROP-PATCH.md; remove once arti ships these changes.
# tor-dirmgr: Arti 0.48's rusqlite upper bound blocks the SQLite advisory fix. The next Arti
# development change widens it; this source patch applies that bound to the released 0.48 crate.
[patch.crates-io]
saturating-time = { path = "third_party/saturating-time" }
rdrand = { path = "third_party/rdrand" }
tor-hsservice = { path = "third_party/tor-hsservice/tor-hsservice-0.48.0" }
tor-dirmgr = { path = "third_party/tor-dirmgr/tor-dirmgr-0.48.0" }
