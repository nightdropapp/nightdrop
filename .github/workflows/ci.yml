# Continuous integration — the automated half of MAINTENANCE.md §3 (TODO #14).
#
# Two jobs:
#   * rust    — fmt / clippy / tests / the Tor-feature compile. Runs on the committed
#               `core/` + `relay/` crates alone, so it is green on a bare checkout.
#   * flutter — analyze + the widget & Dart↔Rust bridge tests (which build and load the
#               real libnightdrop.so). This presupposes the app's platform scaffolding
#               and the vendored `app/rust_builder/` plugin are committed (see
#               `make bootstrap`); until they are, keep this job in mind but expect the
#               rust job to be the live gate.
#
# Not run here: the Tor smoke test and the on-device `integration_test/` suite — both need
# real network/hardware (or xvfb + a display) and stay manual per MAINTENANCE.md §3.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual runs, e.g. from a branch trying a new runner image before `ubuntu-latest` moves to it.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token for every job: nothing here pushes, comments or publishes (CodeQL
# actions/missing-workflow-permissions). Third-party actions are pinned to commits; Dependabot
# (.github/dependabot.yml) proposes updates to the pins.
permissions:
  contents: read

jobs:
  rust:
    name: Rust core + relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel + clippy/rustfmt components.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p nightdrop

      # The Tor path is feature-gated (pulls arti); a plain build never compiles it, so
      # verify it separately. Compile-only — the live circuit test is #[ignore]d.
      #
      # `--tests` is load-bearing and was missing: without it this builds the library only, so
      # core/tests/tor_smoke.rs and relay_e2e.rs are compiled by NOTHING in CI — not by
      # `cargo test` (feature off) and not by `clippy --all-targets` (same). They once sat broken
      # for a whole session and it surfaced only when the documented relay probe was needed during
      # an incident.
      - name: Tor feature compiles (including its test targets)
        run: cargo build -p nightdrop --tests --features tor

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bridge test builds and loads the real libnightdrop.so, so this job needs Rust too.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Single source of truth for the Flutter version: app/.fvmrc. The F-Droid recipe extracts
      # the same file, so CI, local `fvm` users, and reproducible release builds cannot drift.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/.fvmrc

      # flutter_secure_storage (libsecret) + fc_native_video_thumbnail (ffmpeg) native deps,
      # needed once a desktop build is added; harmless for analyze/test.
      - name: Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libavformat-dev libavcodec-dev \
            libavutil-dev libswscale-dev

      - name: Sync generated config
        run: make config

      - name: Build the Rust core (libnightdrop.so)
        run: make core-build

      - name: Resolve Dart deps
        run: cd app && flutter pub get

      # Vendored cargokit under app/rust_builder ships analyzer noise — scope analysis to
      # our own sources (MAINTENANCE.md §3).
      - name: Analyze
        run: cd app && flutter analyze lib test

      - name: Test (widget + Dart↔Rust bridge)
        run: cd app && flutter test
