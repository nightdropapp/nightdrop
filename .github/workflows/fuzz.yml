# Fuzzing the security core (see core/fuzz/README.md). Two levels:
#
#   * build   — on every PR/push touching core/, compile all fuzz targets and replay the
#               committed seed corpus. Fast regression gate that the harness still matches
#               the core's public API and the seeds are valid. No mutation.
#   * campaign — weekly (and on demand) coverage-guided run of each target, with the corpus
#               cached between runs so it accumulates over time (a real campaign, not a cold
#               start). A crash fails the job and uploads the reproducer.
#
# Fuzzing needs nightly + cargo-fuzz (libFuzzer). Both are set up per-run here; nothing is
# required on a normal checkout.

name: Fuzz

on:
  pull_request:
    paths: ['core/**']
  push:
    branches: [main, master]
    paths: ['core/**']
  schedule:
    # Mondays 05:17 UTC — off the hour to avoid the scheduler rush.
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to fuzz each target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the nightly toolchain and cargo-fuzz. `@nightly` (latest each run) means a nightly
# regression in libFuzzer/cargo-fuzz support breaks fuzz CI out of nowhere, with nothing changed
# in this repo — the likely cause of a sudden "all jobs failed". Bump these deliberately after
# confirming a newer nightly + cargo-fuzz build the targets locally (`cargo +<toolchain> fuzz build`).
env:
  FUZZ_TOOLCHAIN: nightly-2026-07-14
  CARGO_FUZZ_VERSION: 0.13.2
  # cargo-fuzz builds for the target ITS OWN binary was compiled for; the prebuilt binary from
  # install-action is musl, so without this it builds fuzz targets for musl (no std installed, and
  # the sanitizer is incompatible with static musl). Force the gnu host target.
  FUZZ_TARGET: x86_64-unknown-linux-gnu

# Read-only token for every job: nothing here pushes, comments or publishes (CodeQL
# actions/missing-workflow-permissions). Third-party actions are pinned to commits; Dependabot
# (.github/dependabot.yml) proposes updates to the pins.
permissions:
  contents: read

jobs:
  # Fast gate: the targets must compile against the current core, and every committed seed
  # must load without crashing (-runs=0 = load + replay, no mutation).
  build:
    name: Build targets + replay seeds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core/fuzz
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}
      - name: Build all fuzz targets
        run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz build --target ${{ env.FUZZ_TARGET }}
      - name: Replay seed corpus (no mutation)
        run: |
          for t in wire_decode relay_handle_line directory_from_wire; do
            echo "::group::replay $t"
            cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz run --target ${{ env.FUZZ_TARGET }} "$t" "fuzz/seeds/$t" -- -runs=0
            echo "::endgroup::"
          done

  # Coverage-guided campaign. Skipped on PRs (costly); runs weekly and on manual dispatch.
  campaign:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    strategy:
      fail-fast: false
      matrix:
        target: [wire_decode, relay_handle_line, directory_from_wire, update_manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core/fuzz
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      # Persist the corpus between runs so coverage accumulates. A unique key per run saves a
      # fresh snapshot; restore-keys pulls the most recent prior corpus for this target.
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        # The duration input reaches the shell through env, never by interpolation into the script.
        env:
          DURATION_INPUT: ${{ github.event.inputs.duration }}
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          DUR="${DURATION_INPUT:-300}"
          case "$DUR" in ''|*[!0-9]*) echo "duration must be a number of seconds" >&2; exit 1 ;; esac
          # Seeds are passed alongside the (cached) corpus; new finds land in the corpus dir.
          cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz run --target ${{ env.FUZZ_TARGET }} "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}" \
            -- -max_total_time="$DUR" -rss_limit_mb=4096

      # A crash writes fuzz/artifacts/<target>/crash-*; keep it so the failure is reproducible.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: core/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
