# nginx vhost for the Night Drop ONION mirror (plaintext HTTP on localhost; Tor encrypts).
# tor's HiddenServicePort 80 maps to 127.0.0.1:8080 — see deploy/onion-torrc.
#
# DO NOT INSTALL THIS unless you have deliberately migrated the onion service to this host.
# It lives in its own file precisely so it cannot be installed by accident along with the
# clear-web vhost.
#
# As of 2026-09-01 the onion is served from the laptop's `nightdrop-onion` systemd user service,
# straight out of the repo's website/ directory. Two hosts must NEVER publish descriptors for the
# same onion key: they fight over the address, and clients get whichever was published last. That
# address is hardcoded in core/src/update.rs as the app's only update channel, so getting this
# wrong breaks updates for every installed build. Read docs/hosting.md section 6 first.
#
# The onion mirror also serves the release binaries, which the clear-web deploy excludes — so its
# web root is NOT the rsync target of scripts/deploy-vps.sh. Adjust `root` accordingly.
server {
    listen 127.0.0.1:8080;
    server_name z6xw2ywlybjeskki4jons5ujepc2pedp5qkgvtbyxorie46qnjpnzqqd.onion;

    root /var/www/nightdrop;
    index index.html;

    # No HSTS/Onion-Location here; the same CSP still applies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /.well-known/security.txt { default_type text/plain; }
    # security.txt's `Policy:` URL, staged into the web root by scripts/deploy-vps.sh.
    # Served as plain text so it renders in the browser instead of downloading. The empty
    # `types` block is doing real work and is not redundant with default_type: nginx >= 1.21
    # ships `text/markdown md` in mime.types (older ones, e.g. 1.18 on Ubuntu 20.04, do not),
    # and default_type applies ONLY when the extension is unmapped. Clearing the map for this
    # one location makes the result the same on every nginx. Verified both ways.
    location = /SECURITY.md { types { } default_type text/plain; charset utf-8; }
    location / { try_files $uri $uri/ =404; }
}
