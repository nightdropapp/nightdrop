# Rust workspace for Night Drop's security core and the minimal relay server.
# The Flutter app lives in app/ and is built separately with the Flutter toolchain.
[workspace]
resolver = "2"
members = ["core", "relay", "webtunnel", "moat"]
# Patched dependencies, built through [patch.crates-io] below, not workspace members.
exclude = ["third_party/tor-hsservice"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
# Bumped 1.75 -> 1.85 for the hybrid PQ pairing (§4.1): the vetted `ml-kem` (FIPS 203) crate
# requires 1.85. Then 1.85 -> 1.92 for arti 0.47 (its MSRV); F-Droid builds with 1.96.
rust-version = "1.92"

# Build the security-critical core with overflow checks even in release.
[profile.release]
overflow-checks = true

# tor-hsservice: descriptor reupload timers pile up, so a long-running client reuploads ever more
# often. See third_party/tor-hsservice/NIGHTDROP-PATCH.md; remove once arti ships the fix.
[patch.crates-io]
tor-hsservice = { path = "third_party/tor-hsservice" }
