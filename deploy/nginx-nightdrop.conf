# nginx server config for the Night Drop clear-web site (nightdrop.app) + the onion vhost.
# Copy to /etc/nginx/conf.d/nightdrop.conf on the VPS, adjust paths, then `nginx -t && systemctl reload nginx`.
#
# TLS certs from Let's Encrypt:  certbot --nginx -d nightdrop.app -d www.nightdrop.app
# The static site is deployed to /var/www/nightdrop by scripts/deploy-vps.sh.

# .webmanifest isn't in nginx's default mime.types.
types { application/manifest+json  webmanifest; }

# ---- HTTP -> HTTPS (clear web) ----
server {
    listen 80;
    listen [::]:80;
    server_name nightdrop.app www.nightdrop.app;
    # ACME http-01 challenge must stay on :80.
    location /.well-known/acme-challenge/ { root /var/www/nightdrop; }
    location / { return 301 https://nightdrop.app$request_uri; }
}

# ---- HTTPS (clear web) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nightdrop.app;

    root /var/www/nightdrop;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nightdrop.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightdrop.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Point Tor Browser at the onion mirror (privacy). Replace with your .onion.
    add_header Onion-Location "http://z6xw2ywlybjeskki4jons5ujepc2pedp5qkgvtbyxorie46qnjpnzqqd.onion$request_uri" always;

    # Security headers. The site is self-contained; the only scripts are inline (hydrate +
    # JSON-LD), so script/style need 'unsafe-inline' (tighten to hashes later if desired).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /.well-known/security.txt { default_type text/plain; }
    location / { try_files $uri $uri/ =404; }

    # Long-cache the immutable, content-addressed assets; keep HTML fresh.
    location ~* \.(png|css|webmanifest)$ { expires 7d; add_header Cache-Control "public"; }
}

# ---- Onion vhost (plaintext HTTP on localhost; Tor provides the encryption) ----
# tor's HiddenServicePort 80 maps to 127.0.0.1:8080 (see deploy/onion-torrc).
server {
    listen 127.0.0.1:8080;
    server_name z6xw2ywlybjeskki4jons5ujepc2pedp5qkgvtbyxorie46qnjpnzqqd.onion;

    root /var/www/nightdrop;
    index index.html;

    # No HSTS/Onion-Location here; the same CSP still applies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /.well-known/security.txt { default_type text/plain; }
    location / { try_files $uri $uri/ =404; }
}
