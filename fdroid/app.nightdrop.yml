# F-Droid build recipe for Night Drop — reference copy of the metadata that goes into
# https://gitlab.com/fdroid/fdroiddata under metadata/app.nightdrop.yml
#
# This app is a Flutter UI over a cross-compiled Rust core (libnightdrop.so, built by cargokit
# through the NDK), so the recipe must provision BOTH Flutter and Rust and build them
# deterministically. Reproducibility is proven locally (see ../docs/reproducible-builds.md): with
# the pinned toolchains + the remap RUSTFLAGS below, every entry in the release APK is byte-for-byte
# identical across clean builds — only the RSA signature block differs, which F-Droid re-creates.
#
# Metadata verified against the repo — no outstanding placeholders. AllowedAPKSigningKeys matches
# the published NightDrop.apk (apksigner: CN=Night Drop, SHA-256 d08b8e64…c0ac); toolchains, version,
# URLs, and NDK all confirmed.
#
# The NIGHTDROP_RELAY onion baked below is the intended production relay (its hidden-service key is
# moved to the production host out of band; the .onion address is stable). Bump the versionCode if
# that address ever changes, since it is compiled into the APK.

Categories:
  - Internet
  - Security
License: AGPL-3.0-or-later
AuthorName: Night Drop
SourceCode: https://github.com/nightdropapp/nightdrop
IssueTracker: https://github.com/nightdropapp/nightdrop/issues
# Donate: (privacy-coin addresses live in config/app_config.json)

# The localized store listing (title, summary, full description, changelogs) is maintained under
# fastlane/metadata/android/en-US/ in the source repo and pulled automatically by F-Droid; the
# Summary/Description below are a reference copy and can be dropped once fastlane is picked up.
AutoName: Night Drop
Summary: Anonymous, end-to-end encrypted 1:1 chat over Tor
Description: |-
    Night Drop is a privacy-first 1:1 messenger. Anonymous identities only (no phone number,
    email, or account), Signal Double Ratchet end-to-end encryption, peer-to-peer over Tor with
    an untrusted store-and-forward relay for offline delivery, and local-first message storage.

    Any relay only ever holds opaque, already-encrypted blobs under unlinkable handles — no keys,
    no plaintext, no identities, no logs.

RepoType: git
Repo: https://github.com/nightdropapp/nightdrop.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0                            # tag exists on origin
    subdir: app
    # F-Droid provides the NDK and a rust toolchain; the exact rustc comes from rust-toolchain.toml
    # (pinned 1.96.0). Pin the same NDK we verified.
    # Matches `flutter.ndkVersion` for Flutter 3.44.6, which pins NDK 28.2.13676358 (= r28c) —
    # confirmed in the SDK (packages/flutter_tools/lib/src/android/gradle_utils.dart). android/app/
    # build.gradle.kts uses flutter.ndkVersion, so this MUST stay in sync on a Flutter bump. Also
    # the NDK tested for reproducibility in docs/reproducible-builds.md.
    ndk: r28c
    rust: stable                              # rust-toolchain.toml pins the concrete 1.96.0
    sudo:
      # Install the EXACT Flutter SDK we build with (framework revision ee80f08bbf = 3.44.6), so the
      # AOT snapshot is reproducible. Pin to the tag, not a moving channel.
      - git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git /opt/flutter
      - /opt/flutter/bin/flutter --version
    prebuild:
      # Android Rust targets for the ABIs we ship.
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    build:
      - export PATH="/opt/flutter/bin:$PATH"
      - export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
      # Reproducibility: strip the machine-specific build dir + cargo registry paths from the Rust
      # core so libnightdrop.so is path-independent. cargokit honours env RUSTFLAGS.
      - export RUSTFLAGS="--remap-path-prefix=$$(cd ../ && pwd)=. --remap-path-prefix=$$CARGO_HOME=/cargo"
      - flutter pub get
      - flutter build apk --release
          --dart-define=NIGHTDROP_TOR=1
          --dart-define=NIGHTDROP_RELAY=bzcqxuxwvtmrmvprsoscnronkjf5wknfuj5ozxiq5fr6qowvnkwrwwad.onion
    output: build/app/outputs/flutter-apk/app-release.apk

  - versionName: 0.1.1
    versionCode: 2
    commit: v0.1.1
    subdir: app
    # Identical toolchain to 0.1.0 — see that entry's comments for the NDK/Flutter/Rust rationale.
    ndk: r28c
    rust: stable
    sudo:
      - git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git /opt/flutter
      - /opt/flutter/bin/flutter --version
    prebuild:
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    build:
      - export PATH="/opt/flutter/bin:$PATH"
      - export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
      - export RUSTFLAGS="--remap-path-prefix=$$(cd ../ && pwd)=. --remap-path-prefix=$$CARGO_HOME=/cargo"
      - flutter pub get
      - flutter build apk --release
          --dart-define=NIGHTDROP_TOR=1
          --dart-define=NIGHTDROP_RELAY=bzcqxuxwvtmrmvprsoscnronkjf5wknfuj5ozxiq5fr6qowvnkwrwwad.onion
    output: build/app/outputs/flutter-apk/app-release.apk

  - versionName: 0.1.2
    versionCode: 3
    commit: v0.1.2
    subdir: app
    # Identical toolchain to 0.1.0 — see that entry's comments for the NDK/Flutter/Rust rationale.
    ndk: r28c
