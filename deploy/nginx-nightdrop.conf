# nginx vhost for the Night Drop clear-web site (nightdrop.app), as live on the maintainer's
# machine (Fedora, nginx 1.30) since the 2026-09-12 cutover. Drop-in — no editing needed:
#
#   sudo cp deploy/nginx-nightdrop.conf /etc/nginx/conf.d/nightdrop.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The host also serves other sites, so this only ever adds a vhost in conf.d; it must not become
# nginx.conf. TLS: certbot --nginx -d nightdrop.app -d www.nightdrop.app (obtain the cert BEFORE
# installing this, or `nginx -t` fails on the missing ssl_certificate); renewal uses certbot's nginx
# authenticator, so moving the web root does not affect it. The static site is deployed to
# /var/www/nightdrop by scripts/deploy-clearnet.sh. On SELinux hosts, see docs/hosting.md.
#
# `http2 on;` needs nginx >= 1.25.1 (older versions: `listen 443 ssl http2;`). No `types {}` block
# for .webmanifest: mime.types on nginx >= 1.21 maps it, and redeclaring it only logs a warning.
#
# The ONION mirror is NOT configured here: it is served by nightdrop-onion.service. If you ever
# migrate it to another host, deploy/nginx-nightdrop-onion.conf is its vhost. Read docs/hosting.md
# first.

# No visitor is logged (self-audit 2026-10-17, P5): the site says "no logs", and nginx's default
# access log kept every visitor's IP and browser. The error log also names the client on every
# 404, so it is limited to `crit` in each server block (as the onion mirror already is).

# ---- HTTP -> HTTPS (clear web) ----
server {
    listen 80;
    listen [::]:80;
    server_name nightdrop.app www.nightdrop.app;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    # ACME http-01 challenge must stay on :80.
    location /.well-known/acme-challenge/ { root /var/www/nightdrop; }
    location / { return 301 https://nightdrop.app$request_uri; }
}

# ---- HTTPS (clear web) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nightdrop.app;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    root /var/www/nightdrop;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nightdrop.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightdrop.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Point Tor Browser at the onion mirror (privacy). Replace with your .onion.
    add_header Onion-Location "http://z6xw2ywlybjeskki4jons5ujepc2pedp5qkgvtbyxorie46qnjpnzqqd.onion$request_uri" always;

    # Security headers. The site is self-contained: no third-party script, style, font or frame.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' stays in this header only until the 0.2 pages are live: from them on
    # (docs/release/0.2-website.patch) every page carries its own strict CSP meta tag -- no inline
    # script or style, Trusted Types -- which the browser enforces on top of this header. Dropping it
    # here first would break the pages still being served.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /.well-known/security.txt { default_type text/plain; }
    # security.txt's `Policy:` URL, staged into the web root by scripts/deploy-clearnet.sh.
    # Served as plain text so it renders in the browser instead of downloading. The empty
    # `types` block is doing real work and is not redundant with default_type: nginx >= 1.21
    # ships `text/markdown md` in mime.types (older ones, e.g. 1.18 on Ubuntu 20.04, do not),
    # and default_type applies ONLY when the extension is unmapped. Clearing the map for this
    # one location makes the result the same on every nginx. Verified both ways.
    location = /SECURITY.md { types { } default_type text/plain; charset utf-8; }
    location / { try_files $uri $uri/ =404; }

    # Long-cache the immutable, content-addressed assets; keep HTML fresh.
    # expires alone, no add_header: an add_header in a location drops every header inherited from
    # the server (HSTS, CSP, nosniff…), which is what happened to these files until 2026-10-13.
    location ~* \.(png|css|webmanifest)$ { expires 7d; }
}

# ---- HTTPS www -> apex ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nightdrop.app;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    ssl_certificate     /etc/letsencrypt/live/nightdrop.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nightdrop.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://nightdrop.app$request_uri;
}
