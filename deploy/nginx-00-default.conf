# Catch-all for requests that name no site this host serves (2026-10-13 audit, round 4).
#
# Without it, nginx answers an unknown name — or a bare-IP connection with no SNI, which is what
# internet-wide scanners send — with whichever vhost loads first. On the maintainer's machine that
# was another site: its certificate came back for the IP that also serves nightdrop.app, so
# scanners indexed the project's server under the operator's personal domain.
#
# Install (it must sort before the other vhosts, hence the 00-):
#   sudo cp deploy/nginx-00-default.conf /etc/nginx/conf.d/00-default.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Named vhosts are unaffected: they still match by server_name / SNI, including certbot's HTTP-01
# challenges on port 80.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444; # close the connection without a response
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuse the TLS handshake itself, so no certificate (and no name in it) is ever sent.
    ssl_reject_handshake on;
}
